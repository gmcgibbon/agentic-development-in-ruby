            # The Harness

            Note:
            - Now, most of us talk to agents
            - Through a special program
            - Called an agent harness
            ---
            ## The Harness

            ![Pi](images/pi.png)

            Note:
            - It could be through an editor like VS Code
            - Through a dedicated app like Pi
            - Or some other custom implementation
            ---
            ## The Harness

            ![Pi](images/pi.png)

            Note:
            - No two harnesses are the same
            - And no one harness is the best
            - But I've been really enjoying Pi
            - So I'll be referencing it in this presentation
            ---
            ## The Harness

            ![Model Context Protocol](images/mcp.svg)

            Note:
            - You may have heard about Model Context Protocol (MCP)
            - I talked about it last year
            - You can use MCP with Pi
            - But Pi doesn't use MCP to provide tools
            - It includes tools in model requests
            ---
            ## The Harness

            ```json[]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "...",
              "messages": [],
              "tools": []
            }
            ```

            Note:
            - So a request from Pi to Claude
            - Would look something like this
            - Let's zoom into the details
            ---
            ## The Harness

            ```json[2]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "...",
              "messages": [],
              "tools": []
            }
            ```

            Note:
            - First we have the model
            - This is just the brain you want to talk to
            - Anthropic has multiple models
            - At different efficiency + price points
            - Here, we're talking to Claude Fable 5.1
            ---
            ## The Harness

            ```json[3]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "...",
              "messages": [],
              "tools": []
            }
            ```

            Note:
            - Next is max tokens
            - Which is the most the agent can spend
            - To generate the next response
            ---
            ## The Harness

            ```json[3]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "...",
              "messages": [],
              "tools": []
            }
            ```

            Note:
            - For most models, 8192 is the default ceiling
            - Lowering this won't make the responses less wordy
            - It might cut responses short
            ---
            ## The Harness

            ```json[4]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "You are an expert coding assistant...",
              "messages": [],
              "tools": []
            }
            ```

            Note:
            - System is your system prompt
            - This is the baseline level of context you provide to the agent
            - In Pi's case, it explains a few things
            ---
            ## The Harness

            ```json[4]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "You are an expert coding assistant...",
              "messages": [],
              "tools": []
            }
            ```

            Note:
            - That the model is a coding assistant
            - A listing of skills and capabilities
            - General guidelines for the agent
            - And so on
            ---
            ## The Harness

            ```json[5-7]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "...",
              "messages": [
                {"role": "user", "content": "Generate a user model..."}
              ],
              "tools": []
            }
            ```

            Note:
            - Next up there's messages
            - This is the conversation so far
            - Your messages will end up here
            - And the agent's messages will too
            ---
            ## The Harness

            ```json[5-7]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "...",
              "messages": [
                {"role": "user", "content": "Generate a user model..."}
              ],
              "tools": []
            }
            ```

            Note:
            - Here we have a user message
            - To generate a User model
            - Messages include text
            - As well as actions taken
            ---
            ## The Harness

            ```json[6-21]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "...",
              "messages": [],
              "tools": [
                {
                  "name": "read",
                  "description": "Read the contents of a file",
                  "input_schema": {
                    "type": "object",
                    "properties": {
                      "path": { "type": "string" },
                      "view_range": {
                        "type": "array", "items": { "type": "integer" }
                      }
                    },
                    "required": ["path"]
                  }
                }
              ]
            }
            ```

            Note:
            - Finally there's tools
            - The capabilities you give your agent
            - By default, Pi provides 4 tools only
            - Read, write, edit, and bash
            ---
            ## The Harness

            ```json[6-21]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "...",
              "messages": [],
              "tools": [
                {
                  "name": "read",
                  "description": "Read the contents of a file",
                  "input_schema": {
                    "type": "object",
                    "properties": {
                      "path": { "type": "string" },
                      "view_range": {
                        "type": "array", "items": { "type": "integer" }
                      }
                    },
                    "required": ["path"]
                  }
                }
              ]
            }
            ```

            Note:
            - This is what the read tool looks like
            - It can accept a path
            - And an optional range
            - Similar to an MCP tool definition
            ---
            ## The Harness

            ```json[6-21]
            {
              "model": "claude-fable-5-1",
              "max_tokens": 8192,
              "system": "...",
              "messages": [],
              "tools": [
                {
                  "name": "read",
                  "description": "Read the contents of a file",
                  "input_schema": {
                    "type": "object",
                    "properties": {
                      "path": { "type": "string" },
                      "view_range": {
                        "type": "array", "items": { "type": "integer" }
                      }
                    },
                    "required": ["path"]
                  }
                }
              ]
            }
            ```

            Note:
            - Pi's toolset is intentionally minimal
            - To reduce cost and complexity
            - Because every request must include
            - The full set of tools and messages
            ---
            ## The Harness

            ```json[]
            {
              "id": "msg_123",
              "type": "message",
              "role": "assistant",
              "model": "claude-fable-5-1",
              "content": [],
              "stop_reason": "tool_use",
              "stop_sequence": null,
              "usage": {}
            }
            ```

            Note:
            - Now that we know what requests look like
            - Let's look at responses
            - The data you get back from an agent
            ---
            ## The Harness

            ```json[2-5]
            {
              "id": "msg_123",
              "type": "message",
              "role": "assistant",
              "model": "claude-fable-5-1",
              "content": [],
              "stop_reason": "tool_use",
              "stop_sequence": null,
              "usage": {}
            }
            ```

            Note:
            - The first few keys are self-explanatory
            - ID is a specific unique identifier
            - Type is always going to be message
            ---
            ## The Harness

            ```json[2-5]
            {
              "id": "msg_123",
              "type": "message",
              "role": "assistant",
              "model": "claude-fable-5-1",
              "content": [],
              "stop_reason": "tool_use",
              "stop_sequence": null,
              "usage": {}
            }
            ```

            Note:
            - Role is the source of the message
            - Which is assistant for agent messages
            - Our messages have a user role
            - And model is the LLM that's talking to you
            ---
            ## The Harness

            ```json[6-17]
            {
              "id": "msg_123",
              "type": "message",
              "role": "assistant",
              "model": "claude-fable-5-1",
              "content": [
                {
                  "type": "thinking",
                  "text": "I need to read the user file..."
                },
                {
                  "type": "tool_use",
                  "name": "read",
                  "input": { "path": "app/models/user.rb" }
                }
              ],
              "stop_reason": "tool_use",
              "stop_sequence": null,
              "usage": {}
            }
            ```

            Note:
            - Content is the guts of the response
            - Where the agent can give feedback
            - Request to use tools
            - Or share what it is thinking
            ---
            ## The Harness

            ```json[6-17]
            {
              "id": "msg_123",
              "type": "message",
              "role": "assistant",
              "model": "claude-fable-5-1",
              "content": [
                {
                  "type": "thinking",
                  "text": "I need to read the user file..."
                },
                {
                  "type": "tool_use",
                  "name": "read",
                  "input": { "path": "app/models/user.rb" }
                }
              ],
              "stop_reason": "tool_use",
              "stop_sequence": null,
              "usage": {}
            }
            ```

            Note:
            - In this case,
            - We have thinking and tool use content
            - The agent wants to read a file
            - Called user.rb
            - And is requesting to read that file
            ---
            ## The Harness

            ```json[7-8]
            {
              "id": "msg_123",
              "type": "message",
              "role": "assistant",
              "model": "claude-fable-5-1",
              "content": [],
              "stop_reason": "tool_use",
              "stop_sequence": null,
              "usage": {}
            }
            ```

            Note:
            - Next up we have stop reason and stop sequence
            - This is why the agent left off where it did
            - It could be a natural stop (end_turn)
            - A request to use a tool (tool_use)
            ---
            ## The Harness

            ```json[7-8]
            {
              "id": "msg_123",
              "type": "message",
              "role": "assistant",
              "model": "claude-fable-5-1",
              "content": [],
              "stop_reason": "tool_use",
              "stop_sequence": null,
              "usage": {}
            }
            ```

            Note:
            - Maybe we ran out of tokens (max_tokens)
            - Or it halted because of a
            - Stop condition we specified (stop_sequence)
            ---
            ## The Harness

            ```json[9]
            {
              "id": "msg_123",
              "type": "message",
              "role": "assistant",
              "model": "claude-fable-5-1",
              "content": [],
              "stop_reason": "tool_use",
              "stop_sequence": null,
              "usage": { "input_tokens": 100, "output_tokens": 20 }
            }
            ```

            Note:
            - Finally there's usage
            - This tells you the cost of the message
            - In tokens
            - And if you're curious
            - A token is ~4 characters of text
            - But this differs depending on the model
            ---
            ## The Harness

            ```json[9]
            {
              "id": "msg_123",
              "type": "message",
              "role": "assistant",
              "model": "claude-fable-5-1",
              "content": [],
              "stop_reason": "tool_use",
              "stop_sequence": null,
              "usage": { "input_tokens": 100, "output_tokens": 20 }
            }
            ```

            Note:
            - Input tokens are the cost of your request
            - Output tokens are the cost of the response
            - Which tells you how much you're spending
            - And how much context window is used
